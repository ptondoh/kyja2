{% extends "base.html" %}
{% block title %}Réglages — Admin{% endblock %}
{% block content %}
<p><a href="/admin">← Administration</a></p>
<h1>Réglages</h1>
{% if request.query_params.get('saved') %}<p class="ok">Enregistré.</p>{% endif %}
{% if errors %}<div class="error" role="alert">{% for e in errors %}<div>{{ e }}</div>{% endfor %}</div>{% endif %}
<form method="post" action="/admin/settings" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Taille maximale d'une vidéo (Mo) <input type="number" name="video_max_mb" min="1" max="2000" required value="{{ video_max_mb }}"></label>
  <label>Durée maximale d'une vidéo (secondes) <input type="number" name="video_max_seconds" min="10" max="3600" required value="{{ video_max_seconds }}"></label>
  <button type="submit">Enregistrer</button>
</form>
{% endblock %}
