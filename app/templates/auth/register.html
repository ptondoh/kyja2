{% extends "base.html" %}
{% block title %}Créer un compte — KYJA BEAUTÉ{% endblock %}
{% block content %}
<h1>Créer un compte</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/auth/register" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Nom complet <input type="text" name="full_name" required maxlength="200" value="{{ form.full_name if form }}" autocomplete="name"></label>
  <label>Email <input type="email" name="email" required value="{{ form.email if form }}" autocomplete="email"></label>
  <label>Téléphone (facultatif) <input type="tel" name="phone" maxlength="50" value="{{ form.phone if form }}" autocomplete="tel"></label>
  <label>Mot de passe (10 caractères minimum) <input type="password" name="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
  <label class="check"><input type="checkbox" name="accept_terms" value="true" required>
    J'accepte les conditions d'utilisation et la politique de confidentialité.</label>
  <label class="check"><input type="checkbox" name="marketing_optin" value="true">
    J'accepte de recevoir des communications marketing de KYJA BEAUTÉ (facultatif, retirable à tout moment).</label>
  <button type="submit">Créer mon compte</button>
</form>
{% endblock %}
