{% extends "base.html" %}
{% block title %}Créer un compte — KYJA BEAUTÉ{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg">
  <div class="mb-8 text-center">
    <img src="/static/img/logo-mark.png" alt="" width="80" height="64" class="mx-auto mb-4 h-16 w-auto">
    <h1 class="text-4xl">Créer un compte</h1>
    <div class="gold-rule mt-4"></div>
  </div>
  <div class="panel">
    {% if error %}<p class="error mb-5" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/auth/register" class="card">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next or '/' }}">
      <label>Nom complet <input type="text" name="full_name" required maxlength="200" value="{{ form.full_name if form }}" autocomplete="name"></label>
      <label>Email <input type="email" name="email" required value="{{ form.email if form }}" autocomplete="email"></label>
      <label>Téléphone (facultatif) <input type="tel" name="phone" maxlength="50" value="{{ form.phone if form }}" autocomplete="tel"></label>
      <label>Mot de passe <span class="muted">10 caractères minimum</span>
        <input type="password" name="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
      <label class="check"><input type="checkbox" name="accept_terms" value="true" required>
        <span>J'accepte les conditions d'utilisation et la politique de confidentialité.</span></label>
      <label class="check"><input type="checkbox" name="marketing_optin" value="true">
        <span>J'accepte de recevoir des communications marketing de KYJA BEAUTÉ <span class="muted">(facultatif, retirable à tout moment)</span>.</span></label>
      <button type="submit" class="btn-gold w-full">Créer mon compte</button>
    </form>
  </div>
  <p class="mt-6 text-center text-sm text-muted">Déjà un compte ? <a href="/auth/login{{ '?next=' ~ (next | urlencode) if next and next != '/' else '' }}" class="link-gold">Se connecter</a></p>
</div>
{% endblock %}
