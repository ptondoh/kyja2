{% extends "base.html" %}
{% block title %}Connexion — KYJA BEAUTÉ{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
  <div class="mb-8 text-center">
    <img src="/static/img/logo-mark.png" alt="" width="80" height="64" class="mx-auto mb-4 h-16 w-auto">
    <h1 class="text-4xl">Connexion</h1>
    <div class="gold-rule mt-4"></div>
  </div>
  <div class="panel">
    {% if error %}<p class="error mb-5" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/auth/login" class="card">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Email <input type="email" name="email" required autocomplete="username"></label>
      <label>Mot de passe <input type="password" name="password" required autocomplete="current-password"></label>
      <button type="submit" class="btn-gold w-full">Se connecter</button>
    </form>
  </div>
  <p class="mt-6 text-center text-sm text-muted">Pas encore de compte ? <a href="/auth/register" class="link-gold">Créer un compte</a></p>
</div>
{% endblock %}
