[project]
name = "kyja-beaute"
version = "0.1.0"
description = "Application web du salon KYJA BEAUTÉ"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "python-magic-bin>=0.4.14; sys_platform == 'win32'",
  "python-magic>=0.4.27; sys_platform != 'win32'",
  "pyjwt>=2.9",
  "redis>=5.0",
  "celery[redis]>=5.4",
  "boto3>=1.35",
  "pillow>=10.4",
  "structlog>=24.4",
  "resend>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "pip-audit>=2.7",
  "truststore>=0.9",
  "imageio-ffmpeg>=0.5",
  "bandit>=1.7",
  "playwright>=1.47",
  "schemathesis>=3.34",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
